[project]
name = "pavatools"
version = "1.0.4"
description = "A collection of AWS FinOps and utility tools"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.40.64",
    "pandas>=2.3.3",
    "streamlit>=1.51.0",
    "twine>=6.2.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
pavatools = "pavatools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pavatools"]
